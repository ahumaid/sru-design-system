services:
  gallery:
    build:
      context: .
      target: development
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    init: true
    ports:
      - "5180:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  production:
    build:
      context: .
      target: production
    profiles:
      - production
    ports:
      - "8099:80"

volumes:
  node_modules:
